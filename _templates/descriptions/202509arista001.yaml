title: selfie
date: 2025/09
camera: BRONICA ETR
film: Arista 400
focal_length_mm: 75
f_number: 2.8
description: |
  I ran into a guy in the neighborhood while out on an evening walk,
  and it turns out he used to be a fashion photographer and has an entire garage full of cameras.
  He straight up just gave me one for free!
  A Bronica ETR medium format SLR.

  I bought a speed grip off eBay so I could hand-shoot it,
  but little did I know that the shutter was slow and so everything not shot on a tripod would turn out blurry.
  Shutter speed doesn't matter so much when you're using a flash though.
