title: riverdale east
film: Infrared conversion (680nm filter)
description: |
  I went here because Google Maps had cool skyline photos from this spot.
  Unfortunately, I went at 2PM on a hazy day with the sun beating down.
  Thankfully, this infrared-converted camera genuinely feels like a cheat code for when the lighting is super bright and boring.
  That, or I'm rationalizing the hours and hours I spent trying to keep track of all the tiny screws while disassembling and reassembling the stupid thing.
