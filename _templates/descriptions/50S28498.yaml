title: beach log
description: |
  I started taking black and white photos because a photography textbook told me it's a good way to train your eye,
  and now I'm kind of addicted.
  In my defense, I am mildly red-green colourblind, so sometimes it's nice to even the playing field.
  Also, when you take away the colour, the texture of things becomes so much more apparent.
  It's a visceral feeling.
