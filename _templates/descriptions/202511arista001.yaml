title: hand me down
date: 2025/11
camera: BRONICA ETR
film: Arista 400
focal_length_mm: 75
f_number: 2.8
description: |
  I don't know how many years I must have spent at this desk.
  It used to be my dad's, and I remember it being where the best, most coveted laptop in the house would reside.
  Password-protected, unfortunately.
  Then it was handed down to me full-time, when we moved homes and I started university.
  
  When I moved out, the desk was given to my brother, but I would make an unexpected return in the spring of 2020.
  Here was where I spent the first months of the COVID lockdown, before I moved back out for the final time in September.
  It's since been fully reclaimed.
