title: walk the seawall
description: |
  My best friend moved away to start his PhD while I still had a year left in my undergrad.
  As part of his Vancouver bucket list, we walked the entire Seawall while listening to a Spotify playlist we made for the occasion.
  The playlist was named (creatively) "Walk the Seawall."
  I don't think I knew it then, but in hindsight, that was the beginning of my post-university-adulthood isolation.

  Two years later, I was still walking that Seawall, and definitely feeling some type of way about it all.
  This time, I had my unjustifiably expensive impulse-purchase of a camera with me.
