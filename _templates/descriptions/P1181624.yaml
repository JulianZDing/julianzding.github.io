title: bridge too far
description: |
  My brother and I drove up here for a nice weekend hike.
  Unfortunately, we stayed a little too long and the park ranger came to find us.
  The worst part is the ranger didn't even manage to find us.
  At first, we thought we'd managed to avoid getting in trouble,
  but the relief was short lived.
  When we got back to the car, we drove down the short patch of road from the lot&mdash;and realized the park gate had been locked and the car was stuck.

  The night ended in an Uber of shame.
