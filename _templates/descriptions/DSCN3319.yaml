title: the six
description: |
  Toronto really feels like a mini-New York to me:
  a smaller concrete jungle with fewer high rises, fewer people on the streets,
  that smells slightly less like piss in the seedier parts.
  But it's got the same chaos&mdash;
  the same long shadows, the same dirt and grime, the same perpetually screaming sirens.

  Granted, I've only ever spent a few days in New York.
