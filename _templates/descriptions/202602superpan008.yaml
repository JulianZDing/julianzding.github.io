date: 2026/02
camera: BRONICA ETR
film: Rollei Superpan 200 (with 680nm filter)
focal_length_mm: 75
description: |
  Accidental double exposure because my Bronica ETR sometimes gets its shutter stuck,
  which means I have to reset it by putting it on multiple exposure mode to get it to prime and fire again.
  But then I have to remember to actually advance the film afterwards.
  
  Turned out kind of cool, though.
