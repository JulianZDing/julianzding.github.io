title: hominid
f_number: 2.8
description: |
  It's fascinating that we weren't always the only species of man-like-thing walking around.
  In fact, our status as the only one remaining is a pretty recent one.
  I wonder what the world would be like if we still shared the world with Denisovans and Neanderthals.
  You probably couldn't even tell us apart from a distance.
