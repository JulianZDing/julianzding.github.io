title: beckoning an illusion
description: |
  You know how the moon seems like it changes sizes?
  I figured it out.
  
  The trick is, the moon itself is always the same size&mdash;but what's around it doesn't have to be.
  That's to say, the moon is far enough away that it never changes size, but you can make other objects smaller or larger with distance.
  So if you put it next to something that's supposed to be big, like skyscrapers on the horizon, then it can seem huge and imposing in comparison.
  On the other hand, if you frame it in stuff that's small, suddenly it seems tiny and cute.
