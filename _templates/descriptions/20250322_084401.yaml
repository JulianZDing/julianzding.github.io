title: genesis
description: |
  Back in the beginning, I first started shooting on a GoPro knock-off action camera.
  The focal length was way too short, the ergonomics sucked, and the image quality was infinitely worse than my phone camera.
  But there was something special about having a dedicated device just for taking photos.
  It felt like I was doing something intentional, maybe even something worth doing.

  I still have that little Akaso on my shelf.
  Maybe I should take it for a walk.
