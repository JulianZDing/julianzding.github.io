title: a social hobby
date: 2025/11
camera: MAMIYA SIX P
film: Arista 400 (expired, shot at 200)
focal_length_mm: 75
description: |
  I don't know what I was really looking for when I decided to get into photography,
  but I do remember I wanted it to be a social hobby.
  I wanted to learn from more experienced photographers, make photographer friends, go to photographer events, that sort of thing.
  
  It didn't pan out that way (I guess "pan" would be better as a cinematography pun).
  Don't get me wrong, I've made some good connections through the hobby,
  but the day-to-day usually looks like lugging a weird-looking contraption around the city and having the occasional odd look thrown my way.
  One thing I have discovered, though: the older the camera you use, the more likely someone will strike up a conversation about it.
