camera: MAMIYA SIX P
film: Fujifilm Acros Neopan 100 II
focal_length_mm: 75
f_number: 3.5
description: |
  I firmly believe that the best camera is the one that inspires you most.
  Forget the specs, the best camera is the one that feels the best in your hands, that looks the cutest on your hip&mdash;the one that makes you actually want to go out and shoot. 

  Unfortunately, this mindset has not stopped me from spending more than I want to admit on cameras.
  At least they're all second-hand.
